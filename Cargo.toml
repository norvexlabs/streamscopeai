[workspace]
resolver = "2"
members = [
    "crates/streamscope-core",
    "crates/streamscope-proxy",
    "crates/streamscope-admin",
    "crates/streamscope-mcp-auth",
    "crates/streamscope-client-templates",
    "crates/streamscope-cli",
    "crates/streamscope-edge-api",
]

[workspace.package]
edition = "2024"
version = "0.0.0" # not used at runtime — real version comes from CHANGELOG.md via build.rs
license = "AGPL-3.0-only"
repository = "https://github.com/norvexlabs/streamscopeai"
publish = false # the crates are this product's, never published to a registry

[profile.release]
# lto = true
# codegen-units = 1
strip = true

[workspace.dependencies]
# Allocator of the static musl binaries
mimalloc = { version = "0.1", default-features = false }
# Byte search
memchr = "2"
# HTTP framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
tower = "0.5"
http-body = "1"
flate2 = "1"
tower-http = { version = "0.7", features = ["trace", "cors", "catch-panic", "compression-gzip"] }

# Upstream HTTP client
# `form` is what lets the CLI POST the token endpoints in the form
# encoding RFC 6749 §4.1.3 mandates.
reqwest = { version = "0.13", features = ["stream", "json", "http2", "form"] }
# reqwest pulls rustls in transitively via hyper-rustls with default features
# stripped, which drops `prefer-post-quantum`. Declaring rustls directly here
# re-enables it (Cargo feature unification) so every outbound TLS ClientHello
# carries the X25519MLKEM768 key share. Required because some upstream TLS
# frontends reset ClientHellos that fall in the 256-511 byte range.
rustls = { version = "0.23", default-features = false, features = ["prefer-post-quantum"] }

# SSE codec + CancellationToken (rt feature) for graceful shutdown signalling.
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"

# Auth
sha2 = "0.11"
bs58 = "0.5"
rand = "0.10.3"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Database
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
sqlx-sqlite = { version = "0.9", package = "sqlx", features = ["sqlite", "runtime-tokio"] }

# Config hot reload
arc-swap = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Constant-time comparison
subtle = "2"

# Cache
moka = { version = "0.12", features = ["future"] }

# Concurrent collections
dashmap = { version = "6", features = ["serde"] }

# Async stream composition
async-stream = "0.3"
pin-project-lite = "0.2"

# Encryption
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
base64 = "0.23"
# P-256 for the per-tenant ES256 JWT signing key. Only the key material is built
# here — jsonwebtoken does the signing and verifying — so the ECDSA feature is
# deliberately left off.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
# Hex encoding of digest outputs — sha2 0.11 returns `Array<u8, _>` (hybrid-array)
# which no longer implements `LowerHex`, so `format!("{:x}", h.finalize())` no longer
# compiles. `hex::encode` works against any `AsRef<[u8]>`, which the new Array still is.
hex = "0.4"

# WebSocket

# Password hashing & JWT
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# OpenID Connect relying party (admin-api only — the proxy has no RP role).
# `default-features = false` is load-bearing: the defaults pull `oauth2/reqwest`,
# which would both add a second major of reqwest beside our 0.13 and route every
# OIDC hop through a client with no egress guard and no body cap. We supply our
# own guarded transport instead.
openidconnect = { version = "4", default-features = false }

# OAuth 2.0 client for the *upstream* hop — the authorization-code exchange and
# refresh we perform against a third-party IdP on a user's behalf. Same
# `default-features = false` rationale as above: we supply the guarded
# transport. Deliberately not used for our own authorization *server*, which
# this crate does not implement, nor for revocation (see `call_revoke`).
oauth2 = { version = "5", default-features = false }

# Scripting
rhai = { version = "1.26", features = ["sync", "serde"] }
regex = "1"

# OpenAPI documentation
utoipa = { version = "6", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
url = "2"
percent-encoding = "2"

# Shell tokeniser (POSIX-conformant) — used by tool-risk-rule normalisers
# to canonicalise Bash command args before matching, so rules don't have to
# work around spacing/quoting/$IFS tricks.
shlex = "2"

# Portal-quickstart renderer validates rendered YAML / TOML output for
# admin-edited client_profile templates so a malformed body fails fast at
# render time. `yaml_serde` is the YAML organisation's maintained `serde_yaml`,
# on a pure-Rust parser.
yaml_serde = "0.10"
toml = "1"

# Handlebars-style template engine used by the portal-quickstart renderer to
# substitute `{{ident}}` / `{{#if}}` / `{{#each}}` placeholders in client-app
# config snippets. `no_default_features` strips out the JSON-Schema validator
# we don't need; only the core template engine plus per-format escape hooks
# stay in.
handlebars = { version = "6", default-features = false }
