  artifact: postgres
  package: krb5-libs
  reason: "krb5-libs 1.22.2-r1 in the official postgres:18.6-alpine3.24 image (built 2026-11-05); Alpine 3.24 ships the fix as krb5-libs 1.22.3-r0, not yet in the image (18.6-alpine, 18-alpine and 18.6-alpine3.24 all still name this digest; the Debian 18.6-trixie build carries fixable zlib1g highs of its own); re-checked 2026-11-11: no rebuild yet. Reached through GSSAPI/Kerberos authentication only: the deployment adds no gss line to the image's default pg_hba (scram-sha-256), and the gateway's own clients connect with a Rust driver that links no Kerberos"
